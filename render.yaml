services:
  - type: web
    name: order4ax-com
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm install --no-save --workspace apps/web @rollup/rollup-linux-x64-gnu@4.60.4 && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: HERMES_WEBHOOK_TOKEN
        sync: false
