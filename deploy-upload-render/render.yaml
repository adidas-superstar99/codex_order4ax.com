services:
  - type: web
    name: coffee-order-app
    runtime: node
    plan: free
    rootDir: deploy-upload-render
    buildCommand: npm install --include=dev && npm install --no-save --workspace apps/web @rollup/rollup-linux-x64-gnu@4.60.4 && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
